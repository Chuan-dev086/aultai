<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shop-api preview</title>
    <style>
      body { background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; padding: 2rem; }
      .card { max-width: 480px; margin: 0 auto; border: 1px solid #1e293b; border-radius: 8px; padding: 1.5rem; }
      .row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #1e293b; }
      #total { font-size: 3rem; font-weight: bold; margin: 1rem 0; }
      #total.negative { color: #f87171; }
      #total.positive { color: #4ade80; }
      #banner { display: none; background: #7f1d1d; color: #fecaca; border-radius: 4px; padding: 0.75rem; margin-top: 1rem; }
      #banner.show { display: block; }
      button { background: #4f46e5; color: #fff; border: 0; border-radius: 4px; padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
      label { display: block; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Checkout preview</h1>
      <div class="row"><span>Cart: 1x 19.90 Mug</span><span>19.90</span></div>
      <label><input type="checkbox" id="useVoucher" checked /> Apply MINUS50</label>
      <button id="checkoutBtn" type="button">Checkout</button>
      <div id="total"></div>
      <div id="banner">Error: Total cannot be negative!</div>
    </div>
    <script>
      document.getElementById("checkoutBtn").addEventListener("click", async () => {
        const useVoucher = document.getElementById("useVoucher").checked;
        const payload = {
          cart: { items: [{ productId: "p1", quantity: 1 }] },
          voucher: useVoucher
            ? { code: "MINUS50", type: "fixed", value: 50, expiresAt: null, minSpend: 0 }
            : null,
        };
        const totalEl = document.getElementById("total");
        const bannerEl = document.getElementById("banner");
        try {
          const res = await fetch("/shop-api/cart/checkout", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await res.json();
          const total = body.total;
          totalEl.textContent = Number(total).toFixed(2);
          if (total < 0) {
            totalEl.className = "negative";
            bannerEl.classList.add("show");
          } else {
            totalEl.className = "positive";
            bannerEl.classList.remove("show");
          }
        } catch (err) {
          totalEl.textContent = "error";
          totalEl.className = "negative";
          bannerEl.classList.add("show");
        }
      });
    </script>
  </body>
</html>
